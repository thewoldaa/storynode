name: build

# ---------------------------------------------------------------------------
# Configure, build and test on Windows, plus a CMake lint pass that runs
# everywhere and is fast enough to give an answer while the Windows job is
# still queueing.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

env:
  # Keep the WebView2 SDK download out of the job log and make the version
  # visible in one place.
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  cmake-lint:
    name: cmake lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gersemi reformats CMake without needing a configured project, so it
      # runs before the SDK download and catches formatting drift early.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gersemi
        run: pip install gersemi

      - name: Check formatting
        run: gersemi --check CMakeLists.txt src/CMakeLists.txt tests/CMakeLists.txt CMakePresets.json

  build-windows:
    name: build and test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache WebView2 SDK
        uses: actions/cache@v4
        with:
          path: third_party
          # Keyed on the script that pins the version, so bumping the version
          # in the script invalidates the cache automatically.
          key: webview2-${{ hashFiles('scripts/fetch-deps.ps1') }}

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Configure
        shell: pwsh
        run: cmake --preset ci

      - name: Build
        shell: pwsh
        run: cmake --build --preset ci

      - name: Test
        shell: pwsh
        run: ctest --preset ci --output-on-failure

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/ci/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
