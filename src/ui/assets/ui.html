<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoryNode</title>

<!-- ---------------------------------------------------------------------
     The shell.

     This file is the page skeleton and nothing else. The stylesheet, the
     canvas and the inspector each live in their own directory and are
     inlined here by the host before it navigates, in the order listed in
     the generated ui_manifest.h.

     That split is not tidiness. Each area is a directory a separate task
     owns, and two tasks editing one file is the conflict the worktree
     harness exists to prevent. The cost is that this page has no <style>
     or <script> tags of its own to fill in; the host does it.

     Everything the areas share is in the shell:
       - the message protocol (window.storynode.receive, post)
       - the current document and selection
       - the render loop and the per-frame ordering
       - the undo and redo keys, which are a binding and not an area's
     An area registers itself and is called; it never reaches into another
     area.
     --------------------------------------------------------------------- -->
</head>
<body>

<header class="toolbar">
  <button id="undo" title="Undo the last edit (Ctrl+Z)" disabled>Undo</button>
  <button id="redo" title="Redo the last undone edit (Ctrl+Y)" disabled>Redo</button>
  <span class="sep"></span>
  <button id="add-dialog" title="Add a dialogue node">+ Dialogue</button>
  <button id="add-branch" title="Add a branch node">+ Branch</button>
  <button id="add-end" title="Add an end node">+ End</button>
  <button id="delete" title="Delete the selected node">Delete</button>
  <button id="fit" title="Fit the graph to the window">Fit</button>
  <span class="title" id="doc-title">Untitled</span>
</header>

<main class="graph" id="graph">
  <!-- The canvas draws the graph into these two layers. -->
  <svg id="edges"></svg>
  <div id="viewport"></div>
  <aside id="panel">
    <h2>Inspector</h2>
    <div class="inspector-body" id="inspector"></div>
  </aside>
</main>

<footer>
  <span id="counts">0 nodes, 0 edges</span>
  <span class="spacer"></span>
  <span id="zoom">100%</span>
  <span id="problems-badge" class="badge ok">no problems</span>
</footer>

<div id="error"></div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// The shell.
//
// Owns three things and nothing else:
//
//   1. The connection to the host, and the message protocol.
//   2. The current document, the selection, and the validation problems.
//   3. The render loop, which calls each registered area in a fixed order.
//
// An area (the canvas, the inspector) registers itself here and is called
// back. The shell never calls into an area by name, and an area never reads
// another area's state. That is what keeps the two independent enough to be
// written in parallel.
// ---------------------------------------------------------------------------

(function () {
  "use strict";

  // --- state ---------------------------------------------------------------

  var state = {
    document: null,
    selectedId: null,
    problems: [],

    // Whether the host says the document differs from what is on disk. The
    // page shows it; it never decides it, because only the host can know.
    dirty: false,

    // What the host says can be undone, and how much. Held here rather than
    // worked out from what this page sent, because the page is not the only
    // thing that edits: the host undoes, the stack is trimmed, and a file is
    // opened. Only the host knows, so it says, and this is what it said.
    history: { canUndo: false, canRedo: false, undoDepth: 0, redoDepth: 0 },

    // View transform. Presentation only: the host never sees it, and two
    // windows onto the same document may differ.
    pan: { x: 0, y: 0 },
    zoom: 1
  };

  // Areas that draw part of the page. Registration order is call order.
  var areas = [];

  // --- the host connection -------------------------------------------------

  /// Send a message to the host.
  ///
  /// Intent, not state: the host applies it to the document and broadcasts a
  /// fresh snapshot. Nothing here patches its own copy optimistically, so the
  /// two sides cannot drift into disagreeing about the document.
  function post(message) {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(JSON.stringify(message));
    } else {
      // Opened in a plain browser for development. Say so rather than failing
      // silently on the first click.
      showError("Not running inside the host: messages go nowhere.");
    }
  }

  // --- helpers -------------------------------------------------------------

  function findNode(id) {
    if (!state.document) { return null; }
    var nodes = state.document.nodes || [];
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].id === id) { return nodes[i]; }
    }
    return null;
  }

  function findPort(node, id) {
    var ports = node.ports || [];
    for (var i = 0; i < ports.length; i++) {
      if (ports[i].id === id) { return ports[i]; }
    }
    return null;
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function showError(text) {
    var box = document.getElementById("error");
    box.textContent = text;
    box.classList.add("show");
    clearTimeout(showError.timer);
    showError.timer = setTimeout(function () {
      box.classList.remove("show");
    }, 6000);
  }

  // --- the render loop -----------------------------------------------------

  function render() {
    for (var i = 0; i < areas.length; i++) {
      areas[i].render(state);
    }
    renderChrome(state);
  }

  /// The parts of the page the shell owns: the title, the counts, the
  /// problems badge, the error box, the undo and redo buttons.
  function renderChrome(current) {
    var doc = current.document;
    var nodes = doc ? (doc.nodes || []).length : 0;
    var edges = doc ? (doc.edges || []).length : 0;

    document.getElementById("counts").textContent =
      nodes + (nodes === 1 ? " node, " : " nodes, ") +
      edges + (edges === 1 ? " edge" : " edges");

    // The asterisk matches the one in the window title, so the two do not
    // disagree about whether there is unsaved work.
    var title = (doc && doc.title) ? doc.title : "Untitled";
    document.getElementById("doc-title").textContent =
      current.dirty ? title + " *" : title;

    renderHistory(current);
    renderProblems(current);
  }

  /// Undo and redo, shown as the host says they are.
  ///
  /// Disabled rather than hidden: a button that appears and disappears moves
  /// the ones beside it, and the user aims at where a button was.
  function renderHistory(current) {
    var history = current.history;

    var undo = document.getElementById("undo");
    undo.disabled = !history.canUndo;
    undo.title = history.canUndo
      ? "Undo the last edit (Ctrl+Z) — " + history.undoDepth + " available"
      : "Nothing to undo";

    var redo = document.getElementById("redo");
    redo.disabled = !history.canRedo;
    redo.title = history.canRedo
      ? "Redo the last undone edit (Ctrl+Y) — " + history.redoDepth + " available"
      : "Nothing to redo";
  }

  function renderProblems(current) {
    var badge = document.getElementById("problems-badge");
    var errors = 0;
    var warnings = 0;

    for (var i = 0; i < current.problems.length; i++) {
      if (current.problems[i].severity === "error") { errors++; }
      else { warnings++; }
    }

    if (errors > 0) {
      badge.className = "badge error";
      badge.textContent = errors + (errors === 1 ? " error" : " errors");
    } else if (warnings > 0) {
      badge.className = "badge warn";
      badge.textContent = warnings + (warnings === 1 ? " warning" : " warnings");
    } else {
      badge.className = "badge ok";
      badge.textContent = "no problems";
    }
  }

  /// Change the selection and tell everything that cares.
  ///
  /// The one place selection changes. An area that set `selectedId` directly
  /// would leave the other areas showing stale content, which is a bug that
  /// only shows up once there are two areas.
  function select(id) {
    if (state.selectedId === id) { return; }
    state.selectedId = id;
    for (var i = 0; i < areas.length; i++) {
      if (areas[i].onSelectionChanged) {
        areas[i].onSelectionChanged(state);
      }
    }
    render();
  }

  // --- the message protocol ------------------------------------------------

  function handle(message) {
    switch (message.type) {
      case "document":
        state.document = message.document;
        state.dirty = message.dirty === true;
        if (state.selectedId && !findNode(state.selectedId)) {
          state.selectedId = null;
        }
        render();
        break;

      case "validation":
        state.problems = message.problems || [];
        render();
        break;

      case "history":
        state.history = {
          canUndo: message.canUndo === true,
          canRedo: message.canRedo === true,
          undoDepth: message.undoDepth || 0,
          redoDepth: message.redoDepth || 0
        };
        render();
        break;

      case "error":
        showError(message.message);
        break;

      default:
        showError('Unknown message type "' + message.type + '" from the host.');
    }
  }

  // The single entry point the host calls. One function rather than many named
  // callbacks, so adding a message type never changes the host code.
  window.storynode = {
    receive: function (text) {
      var message;
      try {
        message = JSON.parse(text);
      } catch (e) {
        showError("Malformed message from the host: " + e.message);
        return;
      }
      handle(message);
    }
  };

  // --- what an area gets ---------------------------------------------------

  /// The surface the shell exposes to an area.
  ///
  /// Deliberately small. An area can read the document and the selection, ask
  /// for the selection to change, send a message to the host, and register
  /// itself for rendering. It cannot reach another area, and it cannot replace
  /// the document — only the host does that, from a message it applied.
  window.storynode.shell = {
    state: state,

    register: function (area) {
      areas.push(area);
      if (area.initialise) {
        area.initialise(window.storynode.shell);
      }
    },

    post: post,
    select: select,
    findNode: findNode,
    findPort: findPort,
    escapeHtml: escapeHtml,
    showError: showError,
    render: render
  };

  // --- start ---------------------------------------------------------------

  // The keyboard the shell owns.
  //
  // Undo and redo are a key binding and not a canvas or inspector concern: the
  // areas edit nodes and properties, and neither of them owns the document.
  // The shell does, so the binding lives here and the areas stay independent
  // of it — and of each other.
  //
  // The host advertises the same shortcuts in its menu, and a Win32
  // accelerator consumes the key before the page is offered it, so in the
  // shipped application this handler usually does not run. It is what makes
  // the binding work when the page is the one that sees the key — a future
  // host that has no accelerator table, or the page opened in a browser for
  // development. Both paths end at the same message, and only one of them
  // ever fires for a given press.
  window.addEventListener("keydown", function (event) {
    if (!event.ctrlKey && !event.metaKey) { return; }

    // Left to the field while one has focus. Ctrl+Z in a half-typed property
    // means "take back what I typed", and the inspector has not sent the edit
    // yet — so undoing the document here would take back the previous edit
    // instead, which is not what the user asked for and is not what they can
    // see the effect of.
    var inField = event.target.tagName === "INPUT" ||
                  event.target.tagName === "TEXTAREA";
    if (inField) { return; }

    var key = (event.key || "").toLowerCase();

    // Ctrl+Shift+Z as well as Ctrl+Y. Both are in use in the wild, and a user
    // who reaches for the other one should not get a beep.
    if (key === "z" && !event.shiftKey) {
      post({ type: "undo" });
      event.preventDefault();
    } else if (key === "y" || (key === "z" && event.shiftKey)) {
      post({ type: "redo" });
      event.preventDefault();
    }
  });

  document.getElementById("undo").addEventListener("click", function () {
    post({ type: "undo" });
  });
  document.getElementById("redo").addEventListener("click", function () {
    post({ type: "redo" });
  });

  // Tell the host we are listening. Nothing the host sends before this arrives
  // is delivered, so this is not optional politeness: without it the page loads
  // with no document and looks broken.
  post({ type: "ready" });
})();
</script>

</body>
</html>
